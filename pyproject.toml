[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rav14-scenesearch"
version = "0.1.0"
description = "Local semantic and hybrid search for BDD100K driving scenes"
requires-python = ">=3.10,<3.14"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

