  effective_batch_size: 16
  micro_batch_size: 1
  learning_rate: 0.00005
  head_learning_rate: 0.0002
  weight_decay: 0.05
  warmup_fraction: 0.05
  patience: 3
  min_delta: 0.001
  scene_weight: 1.0
  object_weight: 0.2
  anchor_weight: 1.0
  camera_dropout: 0.1
runtime:
  workers: 2
  eval_batch_size: 2
  text_batch_size: 64
