seed: 42
dataset:
  processed_dir: data_processed/nuscenes_surround
model:
  repo: openai/clip-vit-large-patch14
  revision: 32bd64288804d66eefd0ccbe215aa642df71cc41
  local_dir: artifacts/pretrained/clip-vit-large-patch14
  image_size: 224
  precision: bf16
  gradient_checkpointing: true
  lora_rank: 8
  lora_alpha: 16
  lora_dropout: 0.05
  lora_targets: [q_proj, v_proj]
  bottleneck: 128
  dropout: 0.2
  residual_scale: 0.2
training:
  output_dir: artifacts/nuscenes_surround_lora
